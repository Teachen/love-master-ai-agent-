version: "3.8"

services:
  # ---------- PGVector 向量数据库 ----------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: love-master-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: love_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 恋爱大师 API 服务 ----------
  api:
    build: .
    container_name: love-master-api
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGVECTOR_HOST: pgvector
    ports:
      - "8000:8000"
    volumes:
      - ./tmp:/app/tmp
